<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encuesta2 - Acceso</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Bootstrap Icons CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Hoja de Estilos Global -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <main class="w-full max-w-md">
    <!-- Brand / Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 bg-gradient-to-tr from-indigo-600 to-violet-500 text-white rounded-2xl shadow-lg shadow-indigo-100 mb-3 text-2xl">
        <i class="bi bi-bar-chart-fill"></i>
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Encuesta2</h1>
      <p class="text-sm text-slate-500 mt-1">Panel de administración y constructor de encuestas</p>
    </div>

    <!-- Login Card -->
    <div class="app-card p-8 sm:p-10 shadow-sm border border-slate-200/80 backdrop-blur-sm">
      <form id="login-form" class="space-y-5">
        <div>
          <label for="login-email" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5 flex items-center gap-1.5">
            <i class="bi bi-envelope text-slate-400"></i> Correo Electrónico
          </label>
          <input 
            type="email" 
            id="login-email" 
            required 
            class="app-input"
            placeholder="tu@correo.com"
          >
        </div>

        <div>
          <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider text-slate-500 mb-1.5 flex items-center gap-1.5">
            <i class="bi bi-key text-slate-400"></i> Contraseña
          </label>
          <input 
            type="password" 
            id="login-password" 
            required 
            class="app-input"
            placeholder="••••••••"
          >
        </div>

        <button type="submit" id="btn-submit" class="btn-primary w-full py-3">
          <i id="btn-icon" class="bi bi-box-arrow-in-right"></i>
          <span id="btn-text">Ingresar al Constructor</span>
        </button>

        <div id="login-error" class="hidden p-3 rounded-lg bg-red-50 border border-red-200 text-red-600 text-xs font-medium text-center">
        </div>
      </form>
    </div>

    <!-- Footer con firma sutil -->
    <div class="text-center mt-8">
      <p class="text-xs text-slate-400">
        Plataforma Encuesta2 &copy; 2026
      </p>
      <p class="text-[10px] text-slate-400 mt-1 select-none signature">
        created by Marck's
      </p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
